[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reconfox"
version = "0.2.0"
description = "CLI/TUI reconnaissance toolkit: IP/ASN/geo resolution, async nmap, ffuf directory fuzzing, exploit lookup. For authorized security testing only."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Fedor Zuev", email = "noreply@github.com" },
]
keywords = ["security", "pentest", "recon", "nmap", "ffuf", "tui", "kali"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "textual>=0.50.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "pydantic>=2.5.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
msf = ["pymetasploit3>=1.0.6"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "respx>=0.20.2",
    "ruff>=0.4.0",
]

[project.scripts]
reconfox = "reconfox.cli:main"

[project.urls]
Homepage = "https://github.com/kovanZ1/reconfox"
Repository = "https://github.com/kovanZ1/reconfox"
Issues = "https://github.com/kovanZ1/reconfox/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/reconfox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "ARG", "SIM"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG"]
